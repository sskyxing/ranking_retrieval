_target_: smile_lightning.core.BaseApp

defaults:
  - _self_
  - schema/trainer: trainer
  - trainer: gpu

mode: train
eval_at_first: false
output_dir: null
ckpt_path: null
project_name: nfcorpus
seed: 12345

module:
  _target_: smile_lightning.apps.retrieval.nfcorpus.module.NFCorpusLightningModule
  model:
    _target_: smile_lightning.apps.retrieval.dpr.DPRBiEncoder
    question_model_name_or_path: bert-base-uncased
    context_model_name_or_path: null
  # This is a weight-only warm start; the optimizer is initialized for this run.
  nq_checkpoint_path: null
  learning_rate: 1.0e-5
  adam_eps: 1.0e-8
  weight_decay: 0.0
  warmup_steps: 10
  max_steps: null
  similarity_mode: dot
  score_scale: 1.0

datamodule:
  _target_: smile_lightning.apps.retrieval.nfcorpus.datamodule.NFCorpusDataModule
  data_root: null
  tokenizer_name_or_path: bert-base-uncased
  use_fast_tokenizer: false
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  max_question_length: 256
  max_context_length: 256
  context_overlap: 64
  hard_negative_count: 20
  hard_negatives_per_query: 1
  seed: 12345
  # Keep every positive pair. DistributedSampler may pad one sample so all
  # ranks have equal-size final batches, but no unique pair is discarded.
  drop_last: false
  pin_memory: true
  persistent_workers: null

callbacks:
  model_checkpoint:
    _target_: smile_lightning.core.callbacks.SmileModelCheckpoint
    filename: epoch={epoch}-step={step}
    monitor: val/recall_at_10
    mode: max
    save_top_k: -1
    save_last: true
    auto_insert_metric_name: false
  learning_rate_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step

hydra:
  searchpath:
    - file://conf/core
    - file://conf/apps/retrieval/dpr
