defaults:
  - workspace: wxtcssingwestus3
  - compute: wxtcssingwestus3
  - storage: default-relevance_c09
  - _self_

pipeline:
  experiment_name: dpr_repro_${oc.env:USER,${oc.env:USERNAME,dev}}_dev
  continue_on_failure: false
  force_rerun: false
  inputs:
    # Official NQ JSON arrays in this user's development directory.
    # Change these data ports to test a different training or validation set.
    train_data: azureml://datastores/relevance_c09/paths/local/users/sixing/dpr/nq-emnlp2020/nq-train.json
    validation_data: azureml://datastores/relevance_c09/paths/local/users/sixing/dpr/nq-emnlp2020/nq-dev.json

    model_name_or_path: bert-base-uncased
    epochs: 40
    per_device_batch_size: 16
    val_batch_size: 16
    learning_rate: 2.0e-5
    adam_eps: 1.0e-8
    weight_decay: 0.0
    warmup_steps: 1237
    seq_length: 256
    workers: 4
    seed: 12345

    enable_average_rank: true
    average_rank_start_epoch: 30
    average_rank_chunk_size: 4096
    validation_context_batch_size: 128
    validation_num_hard_negatives: 30
    validation_num_other_negatives: 30
    validation_max_questions: 10000
    config_additional_override: ""

    trainer_config: gpu
    strategy_config: ddp
    job_type: distributed
    node_count: 1
    process_count_per_node: 8
    is_singularity_job: true
    singularity_vc: webxtcoresearchwus3
    vc_arm_id: null
    instance_type: ND96isr_MI300X_v5
    sla_tier: Premium
    priority: Low
    locations: [canadacentral]
    environment_name: deeprank-lightning-dockers-singularity-ptca-pytorch2-9-rocm6-4-flash-atten-dockerfile:20260402.3
    is_preemptible: false
    compute_target: null
    environment_variables:
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/316a14b3-f94a-4267-a76a-497e589ef0a8/resourcegroups/managed-identities/providers/Microsoft.ManagedIdentity/userAssignedIdentities/coresearch-singularity
      DEFAULT_IDENTITY_CLIENT_ID: 7ff4eaad-8686-4fd3-b319-7aeca13b05bf
      DATASET_ENABLE_FORCE_FOLDER: "false"

    output_datastore: relevance_c09
    output_path: local/users/${oc.env:USER,${oc.env:USERNAME,dev}}/dpr/repro/checkpoints/{run-id}/{output-name}
