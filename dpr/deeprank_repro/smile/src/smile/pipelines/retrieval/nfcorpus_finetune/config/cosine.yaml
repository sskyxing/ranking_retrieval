defaults:
  - workspace: wxtcssingwestus3
  - compute: wxtcssingwestus3
  - storage: default-relevance_c09
  - _self_

pipeline:
  experiment_name: dpr_nfcorpus_cosine_${oc.env:USER,${oc.env:USERNAME,dev}}_dev
  continue_on_failure: false
  force_rerun: false
  settings:
    _dataset_access_mode: DatasetInDpv2
  inputs:
    # Keep the original NQ initialization and NFCorpus train/dev inputs.
    nfcorpus_data: azureml://datastores/relevance_c09/paths/local/users/sixing/dpr/nfcorpus-finetune-v1/
    nq_checkpoint: azureml://datastores/relevance_c09/paths/local/users/sixing/dpr/repro/checkpoints/1942a01b-de55-4f9a-8efe-6cb5cb4e2a20/output_path/checkpoints/best.ckpt

    model_name_or_path: bert-base-uncased
    epochs: 5
    per_device_batch_size: 8
    val_batch_size: 8
    learning_rate: 1.0e-5
    adam_eps: 1.0e-8
    weight_decay: 0.0
    warmup_steps: 10
    max_question_length: 256
    max_context_length: 256
    context_overlap: 64
    hard_negative_count: 20
    hard_negatives_per_query: 1
    workers: 4
    seed: 12345
    similarity_mode: cosine
    # Cosine similarities divided by temperature 0.05 during training.
    score_scale: 20.0
    config_additional_override: ""

    trainer_config: gpu
    strategy_config: ddp
    job_type: distributed
    node_count: 1
    process_count_per_node: 8
    is_singularity_job: true
    singularity_vc: webxtcoresearchwus3
    vc_arm_id: null
    instance_type: ND96isr_MI300X_v5
    sla_tier: Premium
    priority: Low
    locations: [canadacentral]
    environment_name: deeprank-lightning-dockers-singularity-ptca-pytorch2-9-rocm6-4-flash-atten-dockerfile:20260402.3
    is_preemptible: false
    compute_target: null
    environment_variables:
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/316a14b3-f94a-4267-a76a-497e589ef0a8/resourcegroups/managed-identities/providers/Microsoft.ManagedIdentity/userAssignedIdentities/coresearch-singularity
      DEFAULT_IDENTITY_CLIENT_ID: 7ff4eaad-8686-4fd3-b319-7aeca13b05bf
      DATASET_ENABLE_FORCE_FOLDER: "false"

    output_datastore: relevance_c09
    output_path: local/users/${oc.env:USER,${oc.env:USERNAME,dev}}/dpr/nfcorpus-finetune-cosine/checkpoints/{run-id}/{output-name}
